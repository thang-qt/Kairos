name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      # The server embeds internal/server/static, which is the frontend build.
      - run: pnpm build
      - run: pnpm backend:check

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-24.04 already includes Android commandline-tools. The setup-android
      # action invokes the removed legacy "tools" package on these runners.
      - name: Install Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore personal Android signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_DEBUG_KEYSTORE_BASE64 Actions secret to keep APK updates signed with the same key."
            exit 1
          fi
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kairos-debug.keystore"
          chmod 600 "$RUNNER_TEMP/kairos-debug.keystore"
          printf 'KAIROS_DEBUG_KEYSTORE=%s\n' "$RUNNER_TEMP/kairos-debug.keystore" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: cd android && ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Verify APK signing certificate
        if: github.event_name != 'pull_request'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK_CERT=$("$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
          KEY_CERT=$(keytool -exportcert -keystore "$KAIROS_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          test -n "$APK_CERT"
          test "$APK_CERT" = "$KEY_CERT"
      - name: Prepare downloadable APK
        if: github.event_name != 'pull_request'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "kairos-${GITHUB_SHA:0:7}.apk"
      - name: Upload APK
        id: apk
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          path: kairos-*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Link APK in build summary
        if: github.event_name != 'pull_request'
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### Android app\n\n[Download Kairos APK](%s)\n\nOpen this link while signed in to GitHub on your phone, download the APK, and tap it to install.\n' "$APK_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$RUNNER_TEMP/kairos-debug.keystore"
