name: Android release

on:
  push:
    tags: ['android-v*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release tag
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' android/app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "android-v$version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kairos-release.jks"
          chmod 600 "$RUNNER_TEMP/kairos-release.jks"
      - name: Build and check release
        env:
          KAIROS_RELEASE_KEYSTORE: ${{ runner.temp }}/kairos-release.jks
          KAIROS_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KAIROS_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KAIROS_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease
      - name: Verify signed APK and prepare assets
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          test -n "$EXPECTED_CERT"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK=android/app/build/outputs/apk/release/app-release.apk
          cert=$("$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
          test "$cert" = "$EXPECTED_CERT"
          mkdir release
          cp "$APK" "release/kairos-${GITHUB_REF_NAME#android-v}.apk"
          printf '%s\n' "$cert" > release/SIGNING-CERT-SHA256.txt
          cd release
          sha256sum ./*.apk > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
            --title "Kairos Android ${GITHUB_REF_NAME#android-v}" release/*
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kairos-release.jks"
